<head>

  <title>03 / products.html - Yatharth Varshney</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; padding: 32px 24px; }
    .product-grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .product-card {
      flex: 1 1 calc(25% - 16px);
      min-width: 200px;
      max-width: calc(25% - 12px);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .product-image { width: 100%; height: 95px; background-color: #dbe6dc; }
    .product-image svg { width: 100%; height: 100%; display: block; }
    .product-details { padding: 12px 14px; }
    .product-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .product-price { font-size: 13.5px; color: #334155; }
  </style>
</head>
