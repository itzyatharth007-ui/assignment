<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 / menu.html - Yatharth Varshney</title>
  <style>
    :root {
      --color-nav-bg: #0c363f;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: #f8fafc; padding: 24px; }
    .menu-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--color-nav-bg);
      padding: 14px 24px;
      color: #ffffff;
    }
    .brand { font-weight: 800; font-size: 14px; letter-spacing: 0.8px; }
    .nav-list { display: flex; list-style: none; gap: 20px; }
    .nav-list a { color: #e2e8f0; text-decoration: none; font-size: 13.5px; font-weight: 500; }
    .nav-list a:hover { color: #ffffff; text-decoration: underline; }
    .caption { margin-top: 14px; color: #334155; font-size: 14px; }
  </style>
</head>
<body>
  <nav class="menu-bar">
    <div class="brand">CAMPUS MENU &bull; YATHARTH VARSHNEY</div>
    <ul class="nav-list">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <p class="caption">Horizontal links with consistent spacing.[cite: 5]</p>
</body>
</html>
